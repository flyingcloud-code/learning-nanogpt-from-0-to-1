<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="600" y="44" fill="white" font-size="20" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">30-chat.py：终端聊天小工具的结构</text>
  <text x="600" y="70" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">三块积木 = 加载模型 → 采样三件套 → REPL 对话循环</text>

  <!-- 输入框 -->
  <rect x="60" y="110" width="200" height="70" rx="8" fill="#0f172a"/>
  <rect x="60" y="110" width="200" height="70" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="160" y="140" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">输入</text>
  <text x="160" y="162" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">用户问题 / 开头文本</text>

  <!-- 模型加载 -->
  <rect x="340" y="90" width="260" height="110" rx="8" fill="#0f172a"/>
  <rect x="340" y="90" width="260" height="110" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="470" y="118" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">加载模型（load_model）</text>
  <text x="470" y="142" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">ckpt-finetune-dialogue.pt</text>
  <text x="470" y="158" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">→ MyGPT（1074 万参数）</text>
  <text x="470" y="176" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">65 字符词表（第 11/23/28 课积木）</text>

  <!-- 编码 -->
  <rect x="680" y="110" width="200" height="70" rx="8" fill="#0f172a"/>
  <rect x="680" y="110" width="200" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="780" y="140" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">文本 → token</text>
  <text x="780" y="162" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">stoi 查表（第 12 课积木）</text>

  <!-- 生成循环 -->
  <rect x="430" y="280" width="340" height="120" rx="10" fill="#0f172a"/>
  <rect x="430" y="280" width="340" height="120" rx="10" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="310" fill="white" font-size="13" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">生成循环（generate）</text>
  <text x="600" y="338" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">每步：前向拿 logits</text>
  <text x="600" y="360" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">→ sample_next 抽一个字符</text>
  <text x="600" y="382" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">→ 拼回序列继续（第 25 课积木）</text>

  <!-- 采样三件套 -->
  <rect x="860" y="280" width="280" height="120" rx="10" fill="#0f172a"/>
  <rect x="860" y="280" width="280" height="120" rx="10" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1000" y="310" fill="white" font-size="13" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">采样三件套（sample_next）</text>
  <text x="1000" y="340" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">temperature：拧分布形状</text>
  <text x="1000" y="362" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">top-k：只留前 k 个候选</text>
  <text x="1000" y="384" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">top-p：累计概率到 p 为止</text>

  <!-- 输出 -->
  <rect x="680" y="440" width="200" height="70" rx="8" fill="#0f172a"/>
  <rect x="680" y="440" width="200" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="780" y="470" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">token → 文本</text>
  <text x="780" y="492" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">itos 还原（第 12 课积木）</text>

  <!-- 连线 -->
  <line x1="260" y1="145" x2="340" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="145" x2="680" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="180" x2="780" y2="240" stroke="#64748b" stroke-width="2"/>
  <line x1="780" y1="240" x2="600" y2="240" stroke="#64748b" stroke-width="2"/>
  <line x1="600" y1="240" x2="600" y2="280" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <line x1="770" y1="340" x2="860" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="400" x2="600" y2="420" stroke="#64748b" stroke-width="2"/>
  <line x1="600" y1="420" x2="780" y2="420" stroke="#64748b" stroke-width="2"/>
  <line x1="780" y1="420" x2="780" y2="440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 循环返回箭头（生成循环 -> 自身） -->
  <path d="M 430 340 L 400 340 L 400 220 L 470 220" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-cyan)"/>
  <text x="392" y="285" fill="#22d3ee" font-size="9" text-anchor="end" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">循环 max_len 次</text>

  <!-- 底部说明 -->
  <text x="600" y="540" fill="#64748b" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">每一块积木都来自前 29 课：embedding（11）· next-token（12）· 采样（25）· 模型拼装（23）· 微调（28）</text>
</svg>
