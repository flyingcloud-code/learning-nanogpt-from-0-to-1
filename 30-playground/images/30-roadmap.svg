<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="700" y="46" fill="white" font-size="22" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">30 课路线图：从第一个张量到一台会聊天的模型</text>
  <text x="700" y="72" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">每天一课，全部代码在 Mac mini 上真实跑通</text>

  <!-- 阶段一：地基 1-5 -->
  <rect x="40" y="110" width="250" height="150" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="52" y="132" fill="#fbbf24" font-size="11" font-weight="600" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">阶段一 · 地基（1-5 课）</text>
  <rect x="60" y="145" width="210" height="42" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="165" y="163" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">对话全景 · 环境 · 数学</text>
  <text x="165" y="179" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">01-04：token / 张量 / 矩阵 / 熵</text>
  <rect x="60" y="195" width="210" height="42" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="165" y="213" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">第一次训练</text>
  <text x="165" y="229" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">05：NumPy 线性回归 + 梯度下降</text>

  <!-- 阶段二：神经网络 6-11 -->
  <rect x="310" y="110" width="250" height="150" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="322" y="132" fill="#34d399" font-size="11" font-weight="600" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">阶段二 · 神经网络（6-11 课）</text>
  <rect x="330" y="145" width="210" height="42" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="435" y="163" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">前向 · 反向 · 收敛</text>
  <text x="435" y="179" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">06-08：MLP / 反向传播 / Loss</text>
  <rect x="330" y="195" width="210" height="42" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="435" y="213" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">优化 · 泛化 · 词向量</text>
  <text x="435" y="229" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">09-11：SGD/Adam / 正则 / Embedding</text>

  <!-- 阶段三：Transformer 12-18 -->
  <rect x="580" y="110" width="250" height="150" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="592" y="132" fill="#a78bfa" font-size="11" font-weight="600" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">阶段三 · Transformer（12-18 课）</text>
  <rect x="600" y="145" width="210" height="42" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="705" y="163" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">语言模型 · Tokenizer</text>
  <text x="705" y="179" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">12-13：next-token / BPE</text>
  <rect x="600" y="195" width="210" height="42" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="705" y="213" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">Attention · QKV · 多头 · 块</text>
  <text x="705" y="229" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">14-18：注意力 / 掩码 / 位置编码</text>

  <!-- 阶段四：手搓 NanoGPT 19-28 -->
  <rect x="850" y="110" width="250" height="150" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="862" y="132" fill="#22d3ee" font-size="11" font-weight="600" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">阶段四 · 手搓 NanoGPT（19-28 课）</text>
  <rect x="870" y="145" width="210" height="42" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="975" y="163" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">项目骨架 · 手搓全部组件</text>
  <text x="975" y="179" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">19-23：数据 / 训练 / Attention / GPT</text>
  <rect x="870" y="195" width="210" height="42" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="975" y="213" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">训练 · 生成 · 换数据 · 微调</text>
  <text x="975" y="229" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">24-28：收敛 / 采样 / 小说集 / 海盗</text>

  <!-- 阶段五：进阶视野 29-30 -->
  <rect x="1120" y="110" width="240" height="150" rx="12" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="1132" y="132" fill="#fb7185" font-size="11" font-weight="600" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">阶段五 · 进阶视野（29-30 课）</text>
  <rect x="1140" y="145" width="200" height="42" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1240" y="163" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">Scaling law · GPT-2/3 · RLHF</text>
  <text x="1240" y="179" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">29：幂律曲线 / 对齐</text>
  <rect x="1140" y="195" width="200" height="42" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1240" y="213" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">结业：做成可玩的东西</text>
  <text x="1240" y="229" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">30：终端聊天小工具（今天）</text>

  <!-- 阶段间箭头（绕盒子外侧走，不穿过盒子） -->
  <!-- 箭头都在阶段边框上方走 -->
  <line x1="290" y1="122" x2="310" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="122" x2="580" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="122" x2="850" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="122" x2="1120" y2="122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 汇合主线：五条向下的汇入线（从各阶段底部出发，绕到中间竖线） -->
  <line x1="165" y1="260" x2="165" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="435" y1="260" x2="435" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="705" y1="260" x2="705" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="975" y1="260" x2="975" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="1240" y1="260" x2="1240" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- 汇聚横线 -->
  <line x1="165" y1="300" x2="1240" y2="300" stroke="#64748b" stroke-width="2"/>

  <!-- 主下降线（中央） -->
  <line x1="700" y1="300" x2="700" y2="360" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-gold)"/>

  <!-- 终点：可玩的小工具 -->
  <rect x="470" y="375" width="460" height="120" rx="14" fill="#0f172a"/>
  <rect x="470" y="375" width="460" height="120" rx="14" fill="url(#goldGrad)" opacity="0.15"/>
  <rect x="470" y="375" width="460" height="120" rx="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="700" y="412" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">🎁 今天：终端聊天小工具</text>
  <text x="700" y="440" fill="white" font-size="12" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">30-chat.py —— 一个能对话的海盗管家 + 莎士比亚剧作家</text>
  <text x="700" y="464" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">/model 换人格 · /temp 拧温度 · /topk /topp 调采样 · 100 行核心代码</text>
  <text x="700" y="486" fill="#64748b" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">全部积木都是前 29 课手搓的：embedding → attention → 块 → GPT → 训练 → 微调</text>

  <!-- 底部进阶路径 -->
  <line x1="700" y1="495" x2="700" y2="540" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="555" width="920" height="90" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="700" y="582" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">毕业之后：进阶路径</text>
  <text x="700" y="608" fill="white" font-size="11" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">读懂 nanoGPT 全部源码 → 换更大的语料/模型 → 用 LoRA 微调自己的数据集 → 部署成 Web/API 服务</text>
  <text x="700" y="630" fill="#64748b" font-size="10" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">github.com/flyingcloud-code/learning-nanogpt-from-0-to-1</text>

  <!-- 图例 -->
  <text x="52" y="720" fill="#64748b" font-size="10" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">档位：S=解剖核心课（反向传播/Embedding/Attention/QKV/掩码/Transformer块/手搓Attention/GPT/训练循环）</text>
  <text x="52" y="740" fill="#64748b" font-size="10" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif">A=概念+实验 · B=实操课 · C=轻量课 —— 每课代码都在 Mac mini（MPS, torch 2.12.1）真实跑通</text>
</svg>
