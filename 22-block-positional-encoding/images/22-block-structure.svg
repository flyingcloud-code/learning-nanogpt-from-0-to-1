<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="40" fill="white" font-size="18" font-weight="700">第 22 课：手搓 Transformer Block + 位置编码</text>
  <text x="60" y="62" fill="#94a3b8" font-size="10">5 个零件全部手写 · 数据流自上而下 · 橙色 = 残差旁路（x 原样保留）· 右侧 = 位置编码两种方案对比</text>

  <!-- ============ 输入层 ============ -->
  <rect x="60" y="80" width="640" height="64" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="76" y="98" fill="#22d3ee" font-size="9" font-weight="600">输入 · Input</text>
  <rect x="90" y="100" width="300" height="34" rx="6" fill="#0f172a"/>
  <rect x="90" y="100" width="300" height="34" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="240" y="121" fill="white" font-size="11" font-weight="600" text-anchor="middle">x = token 嵌入 + 位置编码</text>

  <!-- 残差分叉点 -->
  <circle cx="390" cy="117" r="4" fill="#fb923c"/>
  <text x="402" y="111" fill="#fb923c" font-size="8">残差旁路（x 原样保留）</text>

  <!-- ============ Block 区域 ============ -->
  <rect x="60" y="160" width="640" height="580" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="12,4"/>
  <text x="76" y="180" fill="#60a5fa" font-size="9" font-weight="600">一个 Transformer Block · forward 核心 4 行代码（第 17 课四件套）</text>

  <!-- 残差旁路：分叉点 → 右侧竖线 → ⊕1 / ⊕2 -->
  <path d="M 390,117 L 620,117 L 620,326 L 502,326" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M 620,326 L 620,566 L 502,566" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- 主流程：入口 → LN1 -->
  <path d="M 240,134 L 240,190" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ===== LN1 ===== -->
  <rect x="100" y="190" width="200" height="52" rx="6" fill="#0f172a"/>
  <rect x="100" y="190" width="200" height="52" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="212" fill="white" font-size="11" font-weight="600" text-anchor="middle">ln_1 · 手搓 LayerNorm</text>
  <text x="200" y="230" fill="#94a3b8" font-size="8" text-anchor="middle">对齐刻度：减均值 ÷ 标准差</text>

  <!-- LN1 → Attn -->
  <path d="M 200,242 L 200,290" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ===== Attn ===== -->
  <rect x="100" y="290" width="200" height="72" rx="6" fill="#0f172a"/>
  <rect x="100" y="290" width="200" height="72" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="314" fill="white" font-size="11" font-weight="600" text-anchor="middle">attn · 手搓因果多头注意力</text>
  <text x="200" y="332" fill="#94a3b8" font-size="8" text-anchor="middle">开会：词与词交换信息（第 21 课）</text>
  <text x="200" y="348" fill="#94a3b8" font-size="8" text-anchor="middle">QKV 打分 → 掩码 → softmax → 混合</text>

  <!-- Attn → ⊕1 -->
  <path d="M 300,326 L 458,326" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ⊕1 -->
  <circle cx="480" cy="326" r="22" fill="#0f172a"/>
  <circle cx="480" cy="326" r="22" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="480" y="331" fill="white" font-size="14" font-weight="700" text-anchor="middle">+</text>
  <text x="480" y="360" fill="#fb923c" font-size="8" text-anchor="middle">残差①</text>

  <!-- ⊕1 → LN2 -->
  <path d="M 480,348 L 480,400 L 200,400 L 200,430" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ===== LN2 ===== -->
  <rect x="100" y="430" width="200" height="52" rx="6" fill="#0f172a"/>
  <rect x="100" y="430" width="200" height="52" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="452" fill="white" font-size="11" font-weight="600" text-anchor="middle">ln_2 · 手搓 LayerNorm</text>
  <text x="200" y="470" fill="#94a3b8" font-size="8" text-anchor="middle">再对齐一次刻度</text>

  <!-- LN2 → FFN -->
  <path d="M 200,482 L 200,530" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ===== FFN ===== -->
  <rect x="100" y="530" width="200" height="72" rx="6" fill="#0f172a"/>
  <rect x="100" y="530" width="200" height="72" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="554" fill="white" font-size="11" font-weight="600" text-anchor="middle">mlp · 手搓 FFN</text>
  <text x="200" y="572" fill="#94a3b8" font-size="8" text-anchor="middle">干活：每个词自己消化（不跨词）</text>
  <text x="200" y="588" fill="#94a3b8" font-size="8" text-anchor="middle">放大 4 倍 → GELU → 缩回</text>

  <!-- FFN → ⊕2 -->
  <path d="M 300,566 L 458,566" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ⊕2 -->
  <circle cx="480" cy="566" r="22" fill="#0f172a"/>
  <circle cx="480" cy="566" r="22" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="480" y="571" fill="white" font-size="14" font-weight="700" text-anchor="middle">+</text>
  <text x="480" y="600" fill="#fb923c" font-size="8" text-anchor="middle">残差②</text>

  <!-- ⊕2 → 输出 -->
  <path d="M 480,588 L 480,630 L 200,630 L 200,660" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ===== 输出 ===== -->
  <rect x="100" y="660" width="200" height="50" rx="6" fill="#0f172a"/>
  <rect x="100" y="660" width="200" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="200" y="683" fill="white" font-size="11" font-weight="600" text-anchor="middle">输出 x'（形状不变）</text>
  <text x="200" y="699" fill="#94a3b8" font-size="8" text-anchor="middle">(B, T, C) → 下一层</text>

  <path d="M 200,710 L 200,742" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="212" y="730" fill="#94a3b8" font-size="8">下一层 Block · 最后接 LayerNorm + LM Head（第 23 课）</text>

  <!-- ============ 位置编码面板 ============ -->
  <rect x="730" y="80" width="330" height="280" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="746" y="100" fill="#a78bfa" font-size="9" font-weight="600">位置编码：两种方案（本课主角）</text>

  <!-- 学习式 -->
  <rect x="750" y="115" width="290" height="72" rx="6" fill="#0f172a"/>
  <rect x="750" y="115" width="290" height="72" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="895" y="138" fill="white" font-size="11" font-weight="600" text-anchor="middle">学习式（GPT 用）· 查表</text>
  <text x="895" y="156" fill="#94a3b8" font-size="8" text-anchor="middle">nn.Embedding(64, C)：表只有 64 行</text>
  <text x="895" y="172" fill="#fb7185" font-size="8" text-anchor="middle">位置 64+ 查表越界 → 物理上不能外推</text>

  <!-- 正弦式 -->
  <rect x="750" y="205" width="290" height="72" rx="6" fill="#0f172a"/>
  <rect x="750" y="205" width="290" height="72" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="895" y="228" fill="white" font-size="11" font-weight="600" text-anchor="middle">正弦式（论文公式）· 不用训练</text>
  <text x="895" y="246" fill="#94a3b8" font-size="8" text-anchor="middle">sin/cos 公式：任意位置都能算</text>
  <text x="895" y="262" fill="#fbbf24" font-size="8" text-anchor="middle">外推能跑，但 loss 照样升高（见实验）</text>

  <!-- 对比结论 -->
  <text x="895" y="305" fill="white" font-size="10" font-weight="600" text-anchor="middle">600 步训练：正弦式 2.22 vs 学习式 2.35</text>
  <text x="895" y="324" fill="#94a3b8" font-size="9" text-anchor="middle">都用手搓组件（2 层 4 头 128 维，Mac mini 实测）</text>
  <text x="895" y="344" fill="#94a3b8" font-size="8" text-anchor="middle">手搓 Block 对拍官方 API：误差 4.8e-07</text>

  <!-- Legend -->
  <text x="60" y="766" fill="#94a3b8" font-size="8">图例：青色 = 手搓组件 · 绿色 = FFN · 灰色 = LayerNorm · 橙色 = 残差旁路 · 紫色 = 位置编码</text>
</svg>
