<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'SF Mono', monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="48" fill="#ffffff" font-size="20" font-weight="700">BPE 合并演示：low low low low low lower lowest newest</text>
  <text x="40" y="74" fill="#94a3b8" font-size="12">每一轮只合并「出现次数最多」的相邻字符对；合并后的新符号进入词表，继续参与下一轮。</text>

  <!-- 步骤 0 -->
  <text x="40" y="122" fill="#fbbf24" font-size="13" font-weight="600">第 0 步 · 初始：44 个字符，一个字符一个 token</text>
  <g font-size="16" font-weight="600">
