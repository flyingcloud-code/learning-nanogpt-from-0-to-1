    <text x="706" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="736" y="260" fill="#64748b" text-anchor="middle">_</text>
    <text x="766" y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="808" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="838" y="260" fill="#64748b" text-anchor="middle">_</text>
    <text x="868" y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="910" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="940" y="260" fill="#64748b" text-anchor="middle">_</text>
    <text x="970" y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="1012" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="1042" y="260" fill="#64748b" text-anchor="middle">_</text>
    <text x="1072" y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="1114" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="1144" y="260" fill="#64748b" text-anchor="middle">_</text>
