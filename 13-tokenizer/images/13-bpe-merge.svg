    <text x="472" y="158" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="502" y="158" fill="#64748b" text-anchor="middle">_</text>
    <text x="532" y="158" fill="#e2e8f0" text-anchor="middle">l</text>
    <text x="562" y="158" fill="#e2e8f0" text-anchor="middle">o</text>
    <text x="592" y="158" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="622" y="158" fill="#64748b" text-anchor="middle">_</text>
    <text x="652" y="158" fill="#e2e8f0" text-anchor="middle">l</text>
    <text x="682" y="158" fill="#e2e8f0" text-anchor="middle">o</text>
    <text x="712" y="158" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="742" y="158" fill="#64748b" text-anchor="middle">_</text>
    <text x="772" y="158" fill="#e2e8f0" text-anchor="middle">l</text>
    <text x="802" y="158" fill="#e2e8f0" text-anchor="middle">o</text>
    <text x="832" y="158" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="862" y="158" fill="#64748b" text-anchor="middle">_</text>
    <text x="892" y="158" fill="#e2e8f0" text-anchor="middle">l</text>
    <text x="922" y="158" fill="#e2e8f0" text-anchor="middle">o</text>
    <text x="952" y="158" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="982" y="158" fill="#64748b" text-anchor="middle">_</text>
    <text x="1012" y="158" fill="#e2e8f0" text-anchor="middle">l</text>
    <text x="1042" y="158" fill="#e2e8f0" text-anchor="middle">o</text>
    <text x="1072" y="158" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="1102" y="158" fill="#64748b" text-anchor="middle">_</text>
    <text x="1132" y="158" fill="#e2e8f0" text-anchor="middle">l</text>
    <text x="1162" y="158" fill="#e2e8f0" text-anchor="middle">o</text>
    <text x="1192" y="158" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="1222" y="158" fill="#64748b" text-anchor="middle">_</text>
    <text x="1252" y="158" fill="#e2e8f0" text-anchor="middle">…</text>
  </g>

  <line x1="40" y1="190" x2="1240" y2="190" stroke="#1e293b" stroke-width="1"/>

  <!-- 步骤 1 -->
  <text x="40" y="224" fill="#fbbf24" font-size="13" font-weight="600">第 1 步 · 「l」+「o」出现 7 次 → 合并成 lo（进入词表）</text>
  <g font-size="16" font-weight="600">
    <text x="52"  y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="94"  y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="124" y="260" fill="#64748b" text-anchor="middle">_</text>
    <text x="154" y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="196" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="226" y="260" fill="#64748b" text-anchor="middle">_</text>
    <text x="256" y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="298" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="328" y="260" fill="#64748b" text-anchor="middle">_</text>
    <text x="358" y="260" fill="#22d3ee" text-anchor="middle">lo</text>
    <text x="400" y="260" fill="#e2e8f0" text-anchor="middle">w</text>
    <text x="430" y="260" fill="#64748b" text-anchor="middle">_</text>
