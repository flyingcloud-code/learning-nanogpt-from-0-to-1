<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="45" fill="white" font-size="18" font-weight="700">nanoGPT 架构全景：从 token 到下一个词</text>
  <text x="60" y="66" fill="#94a3b8" font-size="10">Decoder-only Transformer · 数据流自上而下 · 橙色 = 残差回路（每个 Block 都有）</text>

  <!-- ============ Row 1: Input Layer ============ -->
  <rect x="60" y="95" width="1080" height="75" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="76" y="115" fill="#22d3ee" font-size="9" font-weight="600">输入层 · Input</text>
  <rect x="140" y="125" width="400" height="34" rx="6" fill="#0f172a"/>
  <rect x="140" y="125" width="400" height="34" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="340" y="146" fill="white" font-size="11" font-weight="600" text-anchor="middle">文本 tokens: [12, 45, 78, 93, …]</text>
  <text x="620" y="144" fill="#94a3b8" font-size="9">Tokenizer 把文字切成整数（第 13 课）</text>

  <!-- ============ Row 2: Embedding Layer ============ -->
  <rect x="60" y="200" width="1080" height="130" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="76" y="220" fill="#22d3ee" font-size="9" font-weight="600">嵌入层 · Embedding（文字 → 向量）</text>

  <rect x="120" y="245" width="300" height="62" rx="6" fill="#0f172a"/>
  <rect x="120" y="245" width="300" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="270" y="270" fill="white" font-size="11" font-weight="600" text-anchor="middle">wte · Token Embedding</text>
  <text x="270" y="289" fill="#94a3b8" font-size="9" text-anchor="middle">词表 65 → 向量 384 维</text>

  <rect x="450" y="245" width="300" height="62" rx="6" fill="#0f172a"/>
  <rect x="450" y="245" width="300" height="62" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="270" fill="white" font-size="11" font-weight="600" text-anchor="middle">wpe · Position Embedding</text>
  <text x="600" y="289" fill="#94a3b8" font-size="9" text-anchor="middle">位置 0..T → 向量 384 维</text>

  <rect x="780" y="245" width="300" height="62" rx="6" fill="#0f172a"/>
  <rect x="780" y="245" width="300" height="62" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="930" y="270" fill="white" font-size="11" font-weight="600" text-anchor="middle">tok + pos 相加</text>
  <text x="930" y="289" fill="#94a3b8" font-size="9" text-anchor="middle">语义 + 位置信息</text>

  <path d="M 340,160 L 340,245" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M 340,170 L 340,180 L 600,180 L 600,245" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M 420,276 L 450,276" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M 750,276 L 780,276" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ============ Row 3: Transformer Block ============ -->
  <rect x="60" y="370" width="1080" height="290" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="12,4"/>
  <text x="76" y="390" fill="#60a5fa" font-size="9" font-weight="600">Transformer Block × 12（nanoGPT 默认 n_layer，堆叠 N 次，第 17 课逐行拆）</text>

  <!-- 入口：embedding 层 → Block 顶部中央 -->
  <path d="M 600,330 L 600,370" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="612" y="356" fill="#94a3b8" font-size="8">x</text>

  <!-- 残差主干：入口 → 右侧竖线（y=380 通道，在 attn 顶 405 之上，不穿盒子） -->
  <path d="M 600,380 L 1060,380 L 1060,565" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <path d="M 1060,450 L 936,450" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1060,565 L 936,565" fill="none" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1068" y="420" fill="#fb923c" font-size="8">残差</text>

  <!-- 主流程：入口 → ln_1（从顶部左拐） -->
  <path d="M 600,380 L 250,380 L 250,426" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <circle cx="600" cy="380" r="3" fill="#fb923c"/>
  <text x="612" y="374" fill="#94a3b8" font-size="8">分叉点</text>

  <!-- ===== 上行：ln_1 → attn → ⊕1 ===== -->
  <path d="M 330,450 L 360,450" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M 790,450 L 888,450" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="170" y="428" width="160" height="44" rx="6" fill="#0f172a"/>
  <rect x="170" y="428" width="160" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="250" y="447" fill="white" font-size="11" font-weight="600" text-anchor="middle">ln_1</text>
  <text x="250" y="462" fill="#94a3b8" font-size="8" text-anchor="middle">LayerNorm</text>

  <rect x="360" y="405" width="430" height="90" rx="6" fill="#0f172a"/>
  <rect x="360" y="405" width="430" height="90" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="575" y="424" fill="white" font-size="11" font-weight="600" text-anchor="middle">CausalSelfAttention（第 15/16/21 课）</text>
  <text x="575" y="442" fill="#94a3b8" font-size="9" text-anchor="middle">① c_attn: Q/K/V 投影（384 → 3×384）</text>
  <text x="575" y="458" fill="#94a3b8" font-size="9" text-anchor="middle">② 缩放点积注意力 q·k/√d + 因果掩码 + softmax</text>
  <text x="575" y="474" fill="#94a3b8" font-size="9" text-anchor="middle">③ c_proj: 输出投影，多头合并（384 → 384）</text>

  <circle cx="910" cy="450" r="22" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="910" y="454" fill="white" font-size="12" font-weight="600" text-anchor="middle">+</text>

  <!-- 上行 → 下行连接（y=520 通道，在 attn 底 495 之下、mlp 顶 525 之上，不穿盒子） -->
  <path d="M 910,472 L 910,520 L 250,520 L 250,541" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ===== 下行：ln_2 → mlp → ⊕2 ===== -->
  <path d="M 330,565 L 360,565" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M 790,565 L 888,565" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="170" y="543" width="160" height="44" rx="6" fill="#0f172a"/>
  <rect x="170" y="543" width="160" height="44" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="250" y="562" fill="white" font-size="11" font-weight="600" text-anchor="middle">ln_2</text>
  <text x="250" y="577" fill="#94a3b8" font-size="8" text-anchor="middle">LayerNorm</text>

  <rect x="360" y="525" width="430" height="85" rx="6" fill="#0f172a"/>
  <rect x="360" y="525" width="430" height="85" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="575" y="544" fill="white" font-size="11" font-weight="600" text-anchor="middle">MLP · 前馈网络</text>
  <text x="575" y="562" fill="#94a3b8" font-size="9" text-anchor="middle">c_fc: 384 → 1536（放大 4 倍）</text>
  <text x="575" y="578" fill="#94a3b8" font-size="9" text-anchor="middle">GELU 激活</text>
  <text x="575" y="594" fill="#94a3b8" font-size="9" text-anchor="middle">c_proj: 1536 → 384（缩回）</text>

  <circle cx="910" cy="565" r="22" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="910" y="569" fill="white" font-size="12" font-weight="600" text-anchor="middle">+</text>

  <!-- 输出：⊕2 → Block 底部出口 -->
  <path d="M 910,587 L 910,620 L 600,620 L 600,660" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <text x="585" y="640" fill="#94a3b8" font-size="9" text-anchor="middle">Block 输出 = 下一个 Block 的输入（信息不断加工）</text>

  <!-- arrow to output layer -->
  <path d="M 600,660 L 600,700" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- ============ Row 4: Output Layer ============ -->
  <rect x="60" y="700" width="1080" height="140" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="76" y="720" fill="#a78bfa" font-size="9" font-weight="600">输出层 · 预测下一个词</text>

  <rect x="120" y="745" width="240" height="62" rx="6" fill="#0f172a"/>
  <rect x="120" y="745" width="240" height="62" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="240" y="770" fill="white" font-size="11" font-weight="600" text-anchor="middle">ln_f · 最终 LayerNorm</text>
  <text x="240" y="789" fill="#94a3b8" font-size="9" text-anchor="middle">输出前统一归一化</text>

  <rect x="420" y="745" width="280" height="62" rx="6" fill="#0f172a"/>
  <rect x="420" y="745" width="280" height="62" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="560" y="770" fill="white" font-size="11" font-weight="600" text-anchor="middle">lm_head · 线性层</text>
  <text x="560" y="789" fill="#94a3b8" font-size="9" text-anchor="middle">384 → 词表 65 个分数</text>

  <rect x="760" y="745" width="280" height="62" rx="6" fill="#0f172a"/>
  <rect x="760" y="745" width="280" height="62" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="900" y="770" fill="white" font-size="11" font-weight="600" text-anchor="middle">Softmax + 采样</text>
  <text x="900" y="789" fill="#94a3b8" font-size="9" text-anchor="middle">概率 → 抽下一个 token（第 25 课）</text>

  <path d="M 360,776 L 420,776" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M 700,776 L 760,776" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="60" y="860" width="1080" height="60" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="76" y="880" fill="#94a3b8" font-size="9">图例：</text>
  <rect x="120" y="868" width="16" height="16" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="142" y="881" fill="#cbd5e1" font-size="9">输入/嵌入层</text>
  <rect x="260" y="868" width="16" height="16" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="282" y="881" fill="#cbd5e1" font-size="9">归一化 / 注意力</text>
  <rect x="420" y="868" width="16" height="16" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="442" y="881" fill="#cbd5e1" font-size="9">前馈网络 / 输出</text>
  <circle cx="590" cy="876" r="8" fill="none" stroke="#fb923c" stroke-width="1.5"/>
  <text x="604" y="881" fill="#cbd5e1" font-size="9">残差连接</text>
  <text x="760" y="895" fill="#64748b" font-size="8">参数：baby GPT 6 层 / 6 头 / 384 维 ≈ 1000 万参数（第 1 课真实训练的就是它）</text>
</svg>
